spring.application.name=TaskSphere
spring.config.import=optional:file:.env[.properties]

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tasksphere}
spring.data.mongodb.database=${MONGODB_DATABASE:tasksphere}
app.mongodb.server-selection-timeout-ms=10000
app.mongodb.connect-timeout-ms=10000
app.mongodb.read-timeout-ms=15000

# Scheduled jobs
app.deadline-reminders.initial-delay-ms=60000
app.deadline-reminders.fixed-delay-ms=300000

# Notifications
app.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.email.from=${EMAIL_FROM:no-reply@tasksphere.local}
app.notifications.push.enabled=${PUSH_NOTIFICATIONS_ENABLED:false}
app.notifications.push.endpoint=${PUSH_NOTIFICATIONS_ENDPOINT:}
app.notifications.push.auth-token=${PUSH_NOTIFICATIONS_AUTH_TOKEN:}

# SMTP email delivery. Set EMAIL_NOTIFICATIONS_ENABLED=true and override these values for real email.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}

# Logging
logging.level.org.mongodb.driver.cluster=WARN

# JWT
app.jwt.secret=TaskSphereJWTSuperSecretKey2024XYZ_MustBe256BitsLong!!
app.jwt.expiration=86400000

# Server
server.port=8090
